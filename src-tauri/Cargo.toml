[package]
name = "tetorica-nitro-ds-synth-tauri"
version = "0.100.1"
edition = "2021"
license = "BSD-3-Clause"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
